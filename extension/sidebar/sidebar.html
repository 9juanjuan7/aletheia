<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sidebar.css">
    <title>Aletheia - Truth Analysis</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 Aletheia</h1>
            <p class="tagline">Exposing funding, conflicts, and narratives</p>
        </header>

        <div id="loading" class="section">
            <p>🔄 Analyzing article...</p>
            <p style="font-size: 12px; color: #7f8c8d;">Researching publication funding and credibility...</p>
        </div>

        <div id="results" style="display: none;">
            <!-- Article Info -->
            <div class="section">
                <h2>📄 Article Being Analyzed</h2>
                <p class="article-title" id="article-title"></p>
                <p class="source" id="article-source"></p>
            </div>

            <!-- Main Source Credibility -->
            <div class="section">
                <h2>🎯 Source Credibility</h2>
                <div id="credibility-score"></div>
                <div id="funding-info"></div>
                <div id="red-flags"></div>
                <div id="green-flags"></div>
            </div>

            <!-- Counter-Perspective -->
            <div class="section" id="counter-section">
                <h2>🔄 Counter-Perspective Found</h2>
                <div id="counter-perspective"></div>
            </div>

            <!-- Analysis Warning -->
            <div id="analysis-warning" style="display: none;"></div>

            <!-- Myth Detection -->
            <div class="section" id="myth-section" style="display: none;">
                <h2>⚠️ Myth Detection</h2>
                <div id="myth-detection"></div>
            </div>

            <!-- Missing Context -->
            <div class="section">
                <h2>🚨 Critical Context</h2>
                <div id="missing-context"></div>
            </div>
        </div>
    </div>

    <script src="sidebar.js"></script>
</body>
</html>
