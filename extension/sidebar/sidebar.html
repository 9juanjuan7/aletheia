<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Aletheia</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📖 ALETHEIA</h1>
      <p class="tagline">Revealing Truth in Every Article</p>
    </header>

    <div id="loading" class="section">
      <p>Click the Aletheia icon to analyze an article...</p>
    </div>

    <div id="results" style="display: none;">
      <div class="section">
        <h2>📄 Article</h2>
        <p id="article-title" class="article-title"></p>
        <p id="article-source" class="source"></p>
      </div>

      <div class="section">
        <h2>💰 Follow the Money</h2>
        <div id="funding-info"></div>
      </div>

      <div class="section">
        <h2>📚 Narrative Origins</h2>
        <div id="myth-detection"></div>
      </div>

      <div class="section">
        <h2>🔍 Other Coverage</h2>
        <div id="comparative-coverage"></div>
      </div>

      <div class="section">
        <h2>🕵️ What's Missing</h2>
        <div id="missing-context"></div>
      </div>
    </div>
  </div>
  <script src="sidebar.js"></script>
</body>
</html>
